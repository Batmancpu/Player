name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish verified signed APK to GitHub Releases for Obtainium"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: player-android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    needs: instrumentation
    name: Verify app tests; sign only a requested release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 37 platform and build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-provider: basic

      - name: Prepare release-signing credentials
        id: release_signing
        if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(test):'))) }}
        shell: bash
        env:
          PLAYER_RELEASE_KEYSTORE_BASE64: ${{ secrets.PLAYER_RELEASE_KEYSTORE_BASE64 }}
          PLAYER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_RELEASE_KEYSTORE_PASSWORD }}
          # The alias is a fixed, non-secret JKS entry name.
          PLAYER_RELEASE_KEY_ALIAS: player-release
          PLAYER_RELEASE_KEY_PASSWORD: ${{ secrets.PLAYER_RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          if [[ -z "$PLAYER_RELEASE_KEYSTORE_BASE64" &&
                -z "$PLAYER_RELEASE_KEYSTORE_PASSWORD" &&
                -z "$PLAYER_RELEASE_KEY_ALIAS" &&
                -z "$PLAYER_RELEASE_KEY_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured yet; signed APK creation is skipped."
            exit 0
          fi

          if [[ -z "$PLAYER_RELEASE_KEYSTORE_BASE64" ||
                -z "$PLAYER_RELEASE_KEYSTORE_PASSWORD" ||
                -z "$PLAYER_RELEASE_KEY_ALIAS" ]]; then
            echo "Required release-signing secrets are missing." >&2
            exit 1
          fi

          # The current permanent JKS uses the same password for the store
          # and private-key entry. An optional separate key password is accepted.
          # Do not generate or print a replacement password.
          key_password="${PLAYER_RELEASE_KEY_PASSWORD:-$PLAYER_RELEASE_KEYSTORE_PASSWORD}"

          keystore_path="$RUNNER_TEMP/player-release.jks"
          printf '%s' "$PLAYER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi

          # Validate exact key bytes without disclosing the key or its password.
          # This file SHA-256 identifies the privately generated JKS.
          expected_jks_sha256="c3f17358492299a4adb169f6b726f8211922c094c8acc2c2161b6c6f66933eb9"
          actual_jks_sha256="$(sha256sum "$keystore_path" | cut -d ' ' -f1)"
          if [[ "$actual_jks_sha256" != "$expected_jks_sha256" ]]; then
            echo "Signing secret contains a different or incomplete JKS. Re-copy the full generated Base64 file." >&2
            exit 1
          fi

          if ! keytool -list -keystore "$keystore_path" \
              -storepass "$PLAYER_RELEASE_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "JKS file is correct, but the keystore password secret does not unlock it. Replace PLAYER_RELEASE_KEYSTORE_PASSWORD using only the password in the generated credentials file." >&2
            exit 1
          fi

          if ! keytool -list -keystore "$keystore_path" \
              -storepass "$PLAYER_RELEASE_KEYSTORE_PASSWORD" \
              -alias "$PLAYER_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "JKS and store password are correct, but PLAYER_RELEASE_KEY_ALIAS is wrong. Expected alias: player-release." >&2
            exit 1
          fi

          {
            printf 'PLAYER_RELEASE_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'PLAYER_RELEASE_KEYSTORE_PASSWORD=%s\n' "$PLAYER_RELEASE_KEYSTORE_PASSWORD"
            printf 'PLAYER_RELEASE_KEY_ALIAS=%s\n' "$PLAYER_RELEASE_KEY_ALIAS"
            printf 'PLAYER_RELEASE_KEY_PASSWORD=%s\n' "$key_password"
          } >> "$GITHUB_ENV"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Release-signing credentials loaded; values were not logged."

      - name: Verify release-checker regression fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Run unit tests and assemble CI-only debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Export Room schemas without trusting task cache
        run: gradle --no-daemon --rerun-tasks :app:kspDebugKotlin

      - name: Verify exported Room v1, v2 and v3 schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema_dir = Path("app/schemas/com.batmancpu.player.ui.library.PlayerLibraryDatabase")
          schemas = {path.stem: json.loads(path.read_text(encoding="utf-8")) for path in schema_dir.glob("*.json")}
          if set(schemas) != {"1", "2", "3"}:
              raise SystemExit(f"Expected exact Room schema snapshots 1, 2 and 3; found {sorted(schemas)}")

          version_one = schemas["1"].get("database", {})
          if version_one.get("version") != 1:
              raise SystemExit("Room v1 snapshot must retain database version 1")
          if [entity.get("tableName") for entity in version_one.get("entities", [])] != ["indexed_media"]:
              raise SystemExit("Room v1 baseline entity changed unexpectedly")

          version_two = schemas["2"].get("database", {})
          entities = version_two.get("entities", [])
          tables = {entity.get("tableName") for entity in entities}
          if version_two.get("version") != 2 or tables != {"indexed_media", "manual_tmdb_matches"}:
              raise SystemExit(f"Unexpected Room v2 schema: version={version_two.get('version')}, tables={tables}")
          match = next(entity for entity in entities if entity.get("tableName") == "manual_tmdb_matches")
          if [field.get("columnName") for field in match.get("fields", [])] != ["treeUri", "documentId", "tmdbId", "mediaType", "confirmedAtEpochMs"]:
              raise SystemExit("Unexpected Room v2 manual match columns")
          if match.get("primaryKey", {}).get("columnNames") != ["treeUri", "documentId"]:
              raise SystemExit("Manual match must be scoped by the composite SAF document identity")
          version_three = schemas["3"].get("database", {})
          v3_entities = version_three.get("entities", [])
          v3_tables = {entity.get("tableName") for entity in v3_entities}
          expected_tables = {"indexed_media", "manual_tmdb_matches", "cached_tmdb_metadata"}
          if version_three.get("version") != 3 or v3_tables != expected_tables:
              raise SystemExit(f"Unexpected Room v3 schema: version={version_three.get('version')}, tables={v3_tables}")
          metadata = next(entity for entity in v3_entities if entity.get("tableName") == "cached_tmdb_metadata")
          expected_fields = ["tmdbId", "mediaType", "title", "year", "overview", "posterPath", "backdropPath", "cachedAtEpochMs"]
          if [field.get("columnName") for field in metadata.get("fields", [])] != expected_fields:
              raise SystemExit("Unexpected Room v3 provider metadata columns")
          if metadata.get("primaryKey", {}).get("columnNames") != ["tmdbId", "mediaType"]:
              raise SystemExit("Provider metadata must use the TMDB id/type composite key")
          print("Verified Room v1 baseline, v2 manual matches and v3 offline provider metadata schema")
          PY

      - name: Upload exported Room v1, v2 and v3 schemas for review
        uses: actions/upload-artifact@v7
        with:
          name: Player-Room-Schema-${{ github.sha }}
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Assemble signed release APK
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify production manifest privacy boundary
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        run: python scripts/verify_release_manifest.py app/build/outputs/apk/release/app-release.apk "$ANDROID_HOME/build-tools/37.0.0/aapt2"

      - name: Verify release APK signature and report hashes
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          echo
          sha256sum "$apk"

      - name: Upload signed release APK for installation and updates
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Player-release-v${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Refuse requested publication without permanent signing
        if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(test):'))) }}
        shell: bash
        run: |
          if [[ "${{ steps.release_signing.outputs.enabled }}" != "true" ]]; then
            echo "Cannot publish a release: signing key, store password or alias is missing." >&2
            exit 1
          fi

      - name: Verify permanent signing certificate matches expected identity
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          fingerprint="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          expected="4d2f1789ed27d3961335fe36456455bd9a310b0dcdf41e8ccc925398339e80bf"
          if [[ -z "$fingerprint" || "${fingerprint,,}" != "$expected" ]]; then
            echo "Signed APK certificate does not match the permanent Player release key." >&2
            exit 1
          fi
          echo "Permanent signing certificate fingerprint matches the project record."

      - name: Publish signed APK to GitHub Releases for Obtainium
        if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(test):'))) && steps.release_signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="$RUNNER_TEMP/Player-release-${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "$release_apk"
          hash="$(sha256sum "$release_apk" | cut -d ' ' -f1)"
          {
            echo "Android package: com.batmancpu.player"
            echo "Version: 0.1.${GITHUB_RUN_NUMBER} (versionCode ${GITHUB_RUN_NUMBER})"
            echo "Git commit: ${GITHUB_SHA}"
            echo
            echo "This APK was signed with the permanent Player release key. Use this APK, never the CI-only debug artifact. Later releases can update it in place."
            echo
            echo "APK SHA-256: ${hash}"
            echo "Certificate SHA-256: 4D:2F:17:89:ED:27:D3:96:13:35:FE:36:45:64:55:BD:9A:31:0B:0D:CD:F4:1E:8C:CC:92:53:98:33:9E:80:BF"
            echo
            echo "OFFLINE LIBRARY + PLAYBACK PREVIEW: searchable movie/show grid, title/episode details, built-in local Media3 playback with pause/seek/private resume, clearer scan feedback and a single-surface Glass preview dock. Includes background-safe SAF/index fix. One selected read-only local folder, offline Room persistence; optional direct TMDB requests require explicit opt-in and manual title search; no broad storage, source-media writes or backup."
            echo
            echo "Optional next phone check when available: update without uninstalling, search a movie, open details and Play video; pause/seek, return/reopen and check resume; try airplane mode and folder switching. Compare Glass preview on/off. No file deletion is required."
            echo "Full checklist: https://github.com/Batmancpu/Player/blob/main/docs/PHASE1_PHONE_TEST.md"
            echo "v0.1.79 device report confirmed four videos/titles/years, offline restart and folder switching. New playback/appearance, format coverage and remaining recovery checks need OPPO evidence; no handset FPS measurement or later-phase acceptance is claimed. Development continues independently while the user is away."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "$release_apk" \
            --title "Player ${tag} — Offline library and playback preview" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            --target "${GITHUB_SHA}"


  instrumentation:
    name: Android 15 persistence and SAF integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-provider: basic
      - name: Start synthetic Android 15 test device
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name player-test --package "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd player-test -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/player-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 60); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/player-emulator.log"
          exit 1
      - name: Generate owned local video fixture
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          mkdir -p app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0x31415a:s=320x180:r=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 3 -c:v libx264 -preset ultrafast -profile:v baseline -pix_fmt yuv420p -c:a aac -movflags +faststart app/src/androidTest/assets/synthetic-video.mp4
      - name: Run Room and cursor integration tests
        run: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Collect synthetic interface screenshots
        if: always()
        run: adb pull /sdcard/Download/player-preview-screens "$RUNNER_TEMP/player-screens" || true
      - name: Upload synthetic test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Player-Android15-tests-${{ github.sha }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/player-screens/
          if-no-files-found: warn
          retention-days: 14
