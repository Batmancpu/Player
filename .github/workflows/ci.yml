name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish verified signed APK to GitHub Releases for Obtainium"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: player-android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android build and signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 37 platform and build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-provider: basic

      - name: Prepare release-signing credentials
        id: release_signing
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          PLAYER_RELEASE_KEYSTORE_BASE64: ${{ secrets.PLAYER_RELEASE_KEYSTORE_BASE64 }}
          PLAYER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_RELEASE_KEYSTORE_PASSWORD }}
          PLAYER_RELEASE_KEY_ALIAS: ${{ secrets.PLAYER_RELEASE_KEY_ALIAS }}
          PLAYER_RELEASE_KEY_PASSWORD: ${{ secrets.PLAYER_RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          if [[ -z "$PLAYER_RELEASE_KEYSTORE_BASE64" &&
                -z "$PLAYER_RELEASE_KEYSTORE_PASSWORD" &&
                -z "$PLAYER_RELEASE_KEY_ALIAS" &&
                -z "$PLAYER_RELEASE_KEY_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured yet; signed APK creation is skipped."
            exit 0
          fi

          if [[ -z "$PLAYER_RELEASE_KEYSTORE_BASE64" ||
                -z "$PLAYER_RELEASE_KEYSTORE_PASSWORD" ||
                -z "$PLAYER_RELEASE_KEY_ALIAS" ||
                -z "$PLAYER_RELEASE_KEY_PASSWORD" ]]; then
            echo "Release-signing secrets are only partially configured." >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/player-release.jks"
          printf '%s' "$PLAYER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          if [[ ! -s "$keystore_path" ]]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi

          keytool -list -keystore "$keystore_path" \
            -storepass "$PLAYER_RELEASE_KEYSTORE_PASSWORD" \
            -alias "$PLAYER_RELEASE_KEY_ALIAS" >/dev/null 2>&1

          {
            printf 'PLAYER_RELEASE_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'PLAYER_RELEASE_KEYSTORE_PASSWORD=%s\n' "$PLAYER_RELEASE_KEYSTORE_PASSWORD"
            printf 'PLAYER_RELEASE_KEY_ALIAS=%s\n' "$PLAYER_RELEASE_KEY_ALIAS"
            printf 'PLAYER_RELEASE_KEY_PASSWORD=%s\n' "$PLAYER_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Release-signing credentials loaded; values were not logged."

      - name: Run unit tests and assemble CI-only debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload CI-only debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Player-debug-CI-ONLY-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Assemble signed release APK
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify release APK signature and report hashes
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          echo
          sha256sum "$apk"

      - name: Upload signed release APK for installation and updates
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Player-release-v${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Refuse requested publication without permanent signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
        shell: bash
        run: |
          if [[ "${{ steps.release_signing.outputs.enabled }}" != "true" ]]; then
            echo "Cannot publish a release: all four permanent signing secrets must be configured." >&2
            exit 1
          fi

      - name: Verify permanent signing certificate matches expected identity
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          fingerprint="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')"
          expected="62a097b7be7d22a9883d9e09015c0417727216d73e2506edf470b24a61cdadc0"
          if [[ -z "$fingerprint" || "${fingerprint,,}" != "$expected" ]]; then
            echo "Signed APK certificate does not match the permanent Player release key." >&2
            exit 1
          fi
          echo "Permanent signing certificate fingerprint matches the project record."

      - name: Publish signed APK to GitHub Releases for Obtainium
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.release_signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="$RUNNER_TEMP/Player-release-${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "$release_apk"
          hash="$(sha256sum "$release_apk" | cut -d ' ' -f1)"
          {
            echo "Android package: com.batmancpu.player"
            echo "Version: 0.1.${GITHUB_RUN_NUMBER} (versionCode ${GITHUB_RUN_NUMBER})"
            echo "Git commit: ${GITHUB_SHA}"
            echo
            echo "This APK was signed with the permanent Player release key. Use this APK, never the CI-only debug artifact. Later releases can update it in place."
            echo
            echo "APK SHA-256: ${hash}"
            echo "Certificate SHA-256: 62:A0:97:B7:BE:7D:22:A9:88:3D:9E:09:01:5C:04:17:72:72:16:D7:3E:25:06:ED:F4:70:B2:4A:61:CD:AD:C0"
            echo
            echo "Physical-device acceptance is separate from CI; follow docs/ROADMAP.md."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "$release_apk" \
            --title "Player ${tag} — device test" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            --target "${GITHUB_SHA}"
