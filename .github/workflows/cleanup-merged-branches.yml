name: Remove merged task branches once

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-merged-branches.yml]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'Batmancpu/Player' && startsWith(github.event.head_commit.message, 'chore(branches):')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the eight verified merged task refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected; do
            [[ "$branch" != main && "$branch" =~ ^(fix|test|release)/phase1- ]] || exit 1
            current="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv' | awk -v name="$branch" '$1 == name {print $2}')"
            if [[ -z "$current" ]]; then
              echo "Already absent: $branch"
              continue
            fi
            [[ "$current" == "$expected" ]] || { echo "Preserving changed branch: $branch"; exit 1; }
            behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq '.behind_by')"
            [[ "$behind" == 0 ]] || { echo "Preserving unmerged branch: $branch"; exit 1; }
            latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$latest" == "$expected" ]] || { echo "Preserving newly changed branch: $branch"; exit 1; }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged branch: $branch"
          done <<'BRANCHES'
          fix/phase1-folder-access 57ddfbcba3c19cc4a5e606daddaa3ebbf466d52d
          fix/phase1-incomplete-provider 95577232cbc120f409910ccab4724e2f836e739f
          fix/phase1-library-session 17e46a8c070130d09fa46422fddcd1d3832ba576
          fix/phase1-library-states fec88a9419c895e207414ca03ccced987be3825c
          fix/phase1-scan-limits 8a46a337a278a956cdecd286b423793e80913845
          release/phase1-candidate-checks 36467d1a43583c082335e53efaafc1b790df17e0
          test/phase1-android-harness aeab8c86cbd7cf67e420b7964fcdd817042db75d
          test/phase1-android-integration be24e38b1f58baf0f12f9c87b7c9bb7f5175b951
          BRANCHES
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'
